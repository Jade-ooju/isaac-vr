# Isaac Lab Mimic 통합 텔레오퍼레이션 설정 파일

# VR 설정
vr_tracker:
  # VR 시스템 타입: "steamvr", "quest3", "auto"
  system_type: "auto"
  
  # 업데이트 주파수 (Hz)
  update_rate: 60
  
  # 핸드 트래킹 설정
  hand_tracking:
    enable: true
    confidence_threshold: 0.7
    smoothing_factor: 0.3

# Shadow Hand 설정
shadow_hand:
  # IsaacLab 환경 이름
  environment_name: "Isaac-Repose-Cube-Shadow-Direct-v0"
  
  # 관절 제한 범위 (라디안)
  joint_limits:
    wrist: [-0.5, 0.5]      # WRJ0, WRJ1
    thumb: [-0.8, 0.8]      # THJ0-4
    fingers: [-1.57, 1.57]  # FFJ, MFJ, RFJ, LFJ
  
  # 제어 설정
  control:
    enable_ik: true
    damping_factor: 0.1
    stiffness_factor: 1.0

# 모션 녹화 설정
recording:
  # 기본 녹화 시간 (초)
  default_duration: 5.0
  
  # 저장 형식: "h5", "npz", "json"
  save_format: "h5"
  
  # 저장 경로
  save_path: "./recorded_motions/"

# 시각화 설정
visualization:
  # 실시간 관절 표시
  show_joint_markers: true
  
  # VR 핸드 오버레이
  show_vr_hand_overlay: true
  
  # 성능 모니터링
  show_performance_stats: true

# Isaac Lab Mimic 설정
mimic:
  # 데모 저장 경로
  save_path: "./mimic_demos/"
  
  # 기본 데모 길이 (초)
  default_duration: 10.0
  
  # 서브태스크 주석 달기 활성화
  subtask_annotation: true
  
  # 성공 기준
  success_criteria:
    min_confidence: 0.7
    min_duration: 2.0
  
  # Robomimic 통합 설정
  robomimic:
    # Robomimic 설치 경로 (자동 감지 시 None)
    install_path: null
    
    # 훈련 설정
    training:
      algo_name: "bc"  # Behavior Cloning
      num_epochs: 400
      learning_rate: 1e-4
      batch_size: 32

# 디버깅 설정
debug:
  # 로그 레벨: "DEBUG", "INFO", "WARNING", "ERROR"
  log_level: "INFO"
  
  # 상세한 출력
  verbose: false
  
  # 성능 측정
  enable_profiling: false
